<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MillerKnoll Product Configurator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header class="header">

        <h1>MillerKnoll Product Configurator</h1>

    </header>


    <!-- ========================================= -->
    <!-- MAIN CONTAINER -->
    <!-- ========================================= -->

    <div class="container">


        <!-- ========================================= -->
        <!-- LEFT PANEL -->
        <!-- ========================================= -->

        <aside class="sidebar">


            <!-- ========================================= -->
            <!-- 1. LAMINATE -->
            <!-- ========================================= -->

            <section class="config-section">

                <h2>Laminate</h2>

                <div class="option-grid">


                    <!-- LBB -->

                    <div class="option-card"
                        data-material="adskMatLaminate"
                        data-finish="LBB">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Laminate/LBB.jpg"
                             alt="LBB">

                        <p>LBB</p>

                    </div>


                    <!-- LBC -->

                    <div class="option-card"
                        data-material="adskMatLaminate"
                        data-finish="LBC">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Laminate/LBC.jpg"
                             alt="LBC">

                        <p>LBC</p>

                    </div>


                    <!-- Aged Ash -->

                    <div class="option-card"
                        data-material="adskMatLaminate"
                        data-finish="Aged-Ash">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Laminate/Aged-Ash.jpg"
                             alt="Aged Ash">

                        <p>Aged-Ash</p>

                    </div>


                    <!-- Grey Ash -->

                    <div class="option-card"
                        data-material="adskMatLaminate"
                        data-finish="Grey-Ash">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Laminate/Grey-Ash.jpg"
                             alt="Grey Ash">

                        <p>Grey-Ash</p>

                    </div>


                </div>

            </section>


            <!-- ========================================= -->
            <!-- 2. FABRIC-PANEL -->
            <!-- ========================================= -->

            <section class="config-section">

                <h2>Fabric-Panel</h2>

                <div class="option-grid">


                    <!-- 1AX01 -->

                    <div class="option-card"
                        data-material="adskMatFabric_Panel"
                        data-finish="1AX01">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Fabric-Panel/1AX01.jpg"
                             alt="1AX01">

                        <p>1AX01</p>

                    </div>


                    <!-- 1HA13 -->

                    <div class="option-card"
                        data-material="adskMatFabric_Panel"
                        data-finish="1HA13">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Fabric-Panel/1HA13.jpg"
                             alt="1HA13">

                        <p>1HA13</p>

                    </div>


                    <!-- 1AX05 -->

                    <div class="option-card"
                        data-material="adskMatFabric_Panel"
                        data-finish="1AX05">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Fabric-Panel/1AX05.jpg"
                             alt="1AX05">

                        <p>1AX05</p>

                    </div>


                    <!-- 1AL01 -->

                    <div class="option-card"
                        data-material="adskMatFabric_Panel"
                        data-finish="1AL01">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Fabric-Panel/1AL01.jpg"
                             alt="1AL01">

                        <p>1AL01</p>

                    </div>


                </div>

            </section>


            <!-- ========================================= -->
            <!-- 3. METAL -->
            <!-- ========================================= -->

            <section class="config-section">

                <h2>Metal</h2>

                <div class="option-grid">


                    <!-- WHITE 91 -->

                    <div class="option-card"
                        data-material="adskMatMetal"
                        data-finish="White91">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Metal/91%20White.jpg"
                             alt="White">

                        <p>91 White</p>

                    </div>


                    <!-- G1 -->

                    <div class="option-card"
                        data-material="adskMatMetal"
                        data-finish="G1">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Metal/G1.jpg"
                             alt="Graphite">

                        <p>Graphite</p>

                    </div>


                    <!-- MS -->

                    <div class="option-card"
                        data-material="adskMatMetal"
                        data-finish="MS">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Metal/MS.jpg"
                             alt="Metallic Silver">

                        <p>Metallic Silver</p>


                    </div>


                    <!-- CL -->

                    <div class="option-card"
                        data-material="adskMatMetal"
                        data-finish="CL">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Metal/CL.jpg"
                             alt="Cool Grey">

                        <p>Cool Grey</p>

                    </div>


                </div>

            </section>


            <!-- ========================================= -->
            <!-- 4. SCREEN -->
            <!-- ========================================= -->

                      <section class="config-section">

                <h2>Screen</h2>

                <div class="option-grid">


                    <!-- 4sc10 -->

                    <div class="option-card"
                        data-material="adskMatScreen"
                        data-finish="4sc10">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Screen/4SC10.jpg"
                             alt="4SC10">

                        <p>4SC10</p>

                    </div>


                    <!-- 1AL12 -->

                    <div class="option-card"
                        data-material="adskMatScreen"
                        data-finish="1AL12">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Screen/1AL12.jpg"
                             alt="1AL12">

                        <p>1AL12</p>

                    </div>


                    <!-- 1HA25 -->

                    <div class="option-card"
                        data-material="adskMatScreen"
                        data-finish="1HA25">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Screen/1HA25.jpg"
                             alt="1HA25">

                        <p>1HA25</p>

                    </div>


                    <!-- 1HA22 -->

                    <div class="option-card"
                        data-material="adskMatScreen"
                        data-finish="1HA22">

                        <img src="https://raw.githubusercontent.com/kirti15g-cloud/MK-Configurator-New/main/images/Screen/1HA22.jpg"
                             alt="1HA22">

                        <p>1HA22</p>

                    </div>


                </div>

            </section>


        </aside>


        <!-- ========================================= -->
        <!-- RIGHT PANEL - SKETCHFAB VIEWER -->
        <!-- ========================================= -->

        <main class="viewer">

            <iframe
                id="api-frame"
                title="Sketchfab Viewer"
                frameborder="0"
                allow="autoplay; fullscreen; xr-spatial-tracking"
                allowfullscreen>
            </iframe>

        </main>


    </div>


    <!-- ========================================= -->
    <!-- SKETCHFAB API -->
    <!-- ========================================= -->

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

    <script src="viewer.js"></script>

    <script src="script.js"></script>


</body>

</html>
